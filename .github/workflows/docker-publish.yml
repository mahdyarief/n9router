name: Build, Push Docker Image and Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build (leave empty to create a new tag/release from master)"
        required: false
        type: string

env:
  IMAGE_NAME: nightwalker8x/n9router

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve / create release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Triggered by a pushed v* tag — build exactly that tag.
            TAG="${{ github.ref_name }}"
            echo "Triggered by tag push: $TAG"
          elif [ -n "$INPUT_TAG" ]; then
            # A specific release tag was selected for the manual run.
            TAG="$INPUT_TAG"
            echo "Building selected release tag: $TAG"
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Selected tag '$TAG' does not exist."
              exit 1
            fi
          else
            # No tag selected — cut a new tag/release from master using package.json version.
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
            echo "No tag selected — using package.json version: $TAG"
            if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists — reusing it."
            else
              git tag "$TAG"
              git push origin "$TAG"
              echo "Created and pushed tag $TAG."
            fi
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --title "$TAG" --generate-notes
              echo "Created release $TAG."
            else
              echo "Release $TAG already exists."
            fi
          fi
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Check Docker Hub credentials
        id: guard
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets not set — skipping Docker build & push."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          ref: ${{ needs.prepare-release.outputs.ref }}

      - uses: docker/setup-buildx-action@v3
        if: steps.guard.outputs.enabled == 'true'

      - name: Log in to Container Registry
        if: steps.guard.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: steps.guard.outputs.enabled == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}},value=${{ needs.prepare-release.outputs.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare-release.outputs.ref }}
            type=raw,value=latest

      - name: Build and push
        if: steps.guard.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

  publish-npm:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check npm token
        id: guard
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          ref: ${{ needs.prepare-release.outputs.ref }}

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        if: steps.guard.outputs.enabled == 'true'
        run: npm run publish:npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
